name: PR Checks

# Build + validate everything on PRs into dev and main. No deployment happens here.
on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET) build + fast tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'   # project targets net10.0 (preview)
      - name: Restore
        run: dotnet restore RentalPlatform.slnx
      - name: Build (Release)
        run: dotnet build RentalPlatform.slnx -c Release --no-restore
      - name: Test (Fast)
        run: >-
          dotnet test RentalPlatform.Tests/RentalPlatform.Tests.csproj
          -c Release --no-build --no-restore
          --filter "Category=Fast"

  backend-postgres:
    name: Backend PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAZA_TEST_DB: >-
        Host=127.0.0.1;Port=5432;Database=kaza_test;
        Username=postgres;Password=kaza_test_ci;Pooling=false;
        Timeout=5;Command Timeout=120
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kaza_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: kaza_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kaza_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'
      - name: Restore
        run: dotnet restore RentalPlatform.slnx
      - name: Test (PostgreSQL)
        run: >-
          dotnet test RentalPlatform.Tests/RentalPlatform.Tests.csproj
          -c Release --no-restore
          --filter "Category=PostgreSQL"

  api-container:
    name: API production image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build API image
        run: docker build -f RentalPlatform.API/Dockerfile -t kaza-api:pr-check .

  frontend-demo:
    name: demo (storefront) build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm ci
      - name: Build
        # Placeholder NEXT_PUBLIC_* — we only assert the build compiles in CI.
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_PLATFORM_URL: https://app.example.com
          NEXT_PUBLIC_STORAGE_URL: ""
        run: npm run build

  frontend-portal:
    name: rental-platform (portals) build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rental-platform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: rental-platform/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_STORAGE_URL: ""
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_MAPBOX_TOKEN: ""
          NEXT_PUBLIC_ALLOWED_RETURN_ORIGINS: https://kaza.example.com
        run: npm run build

  compose-validate:
    name: Validate production compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test production migration and backup safeguards
        run: |
          bash scripts/tests/test-apply-migrations-selection.sh
          bash scripts/tests/test-backup-postgres-safety.sh
          bash scripts/tests/test-production-env-loading-safety.sh
          bash scripts/tests/test-deployment-safety-guards.sh
      - name: Test production migration workflow on PostgreSQL 16
        run: |
          container=kaza-release-hardening-ci-test-pg16
          docker run -d --name "$container" \
            -e POSTGRES_PASSWORD=test-only \
            postgres:16-alpine >/dev/null
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do
            if docker exec "$container" pg_isready -U postgres -d postgres >/dev/null 2>&1; then
              break
            fi
            [ "$attempt" -lt 60 ] || { echo "PostgreSQL 16 did not become ready" >&2; exit 1; }
            sleep 1
          done
          KAZA_MIGRATION_TEST_CONTAINER="$container" \
            KAZA_MIGRATION_TEST_DB_PREFIX=kaza_test_release_hardening \
            bash scripts/tests/test-release-hardening-migrations-postgresql.sh
          KAZA_MIGRATION_TEST_CONTAINER="$container" \
            KAZA_MIGRATION_TEST_DB_PREFIX=kaza_test_current_migrations \
            bash scripts/tests/test-current-production-migrations-postgresql.sh
      - name: Render placeholder env + validate
        run: |
          cp .env.example .env.ci
          docker compose -f docker-compose.prod.yml --env-file .env.ci config >/dev/null
          echo "docker-compose.prod.yml is valid."

  final-rc-automation:
    name: Final RC automated evidence
    needs:
      - backend
      - backend-postgres
      - api-container
      - frontend-demo
      - frontend-portal
      - compose-validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: rental-platform/package-lock.json
      - name: Install Playwright system dependencies
        working-directory: rental-platform
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run hosted final-RC evidence lane
        env:
          RC_SHA: ${{ github.event.pull_request.head.sha }}
          RC_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          bash scripts/final-rc-gates.sh
          --expected-sha "$RC_SHA"
          --lane hosted
          --mode automated
          --evidence-root "artifacts/final-rc"
          --run-id "$RC_RUN_ID"
      - name: Upload final-RC automated evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-rc-automated-evidence-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/final-rc/${{ github.event.pull_request.head.sha }}/gh-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
